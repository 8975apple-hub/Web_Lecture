<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   <!-- 해결방법2 - 이벤티 활용하기 -->
   <script>
        window.onload = function(){
            document.querySelector('h1').style.backgroundColor = 'red';
            document.querySelector('h2').style.color = 'red'
        };
    </script> 
</head>
<body>
    <h1>process - 1</h1>
    <h2>process - 2</h2>
